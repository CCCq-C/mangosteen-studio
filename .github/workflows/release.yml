name: Release Mangosteen Studio
run-name: Release Mangosteen Studio ${{ startsWith(inputs.version, 'v') && inputs.version || format('v{0}', inputs.version) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本号（X.Y.Z）
        type: string
        required: true
      ref:
        description: 留空使用当前选择的版本；签名构建要求与所选工作流版本为同一提交
        type: string
permissions:
  contents: read

concurrency:
  group: toonflow-release
  cancel-in-progress: false

jobs:
  build:
    name: 构建所有平台版本
    uses: ./.github/workflows/debug.yml
    with:
      target: all
      ref: ${{ inputs.ref || github.sha }}
      version: ${{ inputs.version || github.ref_name }}
      generatePatch: true
      androidRelease: true
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
      MACOS_NOTARIZATION_ISSUER_ID: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
      MACOS_NOTARIZATION_KEY_BASE64: ${{ secrets.MACOS_NOTARIZATION_KEY_BASE64 }}

  release:
    name: 发布 GitHub 与 Gitee Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 校验已有版本标签
        env:
          GH_TOKEN: ${{ github.token }}
          releaseVersion: ${{ needs.build.outputs.version }}
          buildCommit: ${{ needs.build.outputs.commit }}
          defaultBranch: ${{ github.event.repository.default_branch }}
        run: |
          node --input-type=module <<'JS'
          const tag = `refs/tags/v${process.env.releaseVersion}`;
          const api = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" };
          const branchResponse = await fetch(`${api}/git/ref/heads/${encodeURIComponent(process.env.defaultBranch)}`, {
            headers,
            signal: AbortSignal.timeout(30000),
          });
          if (!branchResponse.ok) throw new Error(`读取默认分支失败（HTTP ${branchResponse.status}）`);
          const branch = await branchResponse.json();
          if (branch.object?.sha !== process.env.buildCommit) throw new Error("正式发布只能使用 GitHub 默认分支的最新提交，请先合并代码后重试。");
          let response = await fetch(`${api}/git/ref/tags/v${process.env.releaseVersion}`, {
            headers,
            signal: AbortSignal.timeout(30000),
          });
          if (response.status !== 404) {
            if (!response.ok) throw new Error(`读取版本标签失败（HTTP ${response.status}）`);
            let { object } = await response.json();
            while (object.type === "tag") {
              response = await fetch(`${api}/git/tags/${object.sha}`, { headers, signal: AbortSignal.timeout(30000) });
              if (!response.ok) throw new Error(`解析版本标签失败（HTTP ${response.status}）`);
              ({ object } = await response.json());
            }
            if (object.type !== "commit" || object.sha !== process.env.buildCommit) throw new Error(`${tag} 与构建提交不一致，请使用新版本号或选择该标签对应的代码。`);
          }
          JS
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 下载各平台产物
        uses: actions/download-artifact@v8
        with:
          pattern: toonflow-${{ needs.build.outputs.version }}-*
          path: artifacts
          merge-multiple: true
      - name: 生成双平台下载说明
        env:
          releaseVersion: ${{ needs.build.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, writeFileSync } from "node:fs";

          const files = readdirSync("artifacts");
          const version = process.env.releaseVersion;
          const findInstaller = (label, matches) => {
            const names = files.filter(matches);
            if (names.length !== 1) throw new Error(`${label} 安装包数量应为 1，实际为 ${names.length}`);
            return names[0];
          };
          const windows = findInstaller("Windows", name => name === `toonflow-${version}-Setup.exe`);
          const macArm = findInstaller("macOS ARM64", name => name.endsWith(".dmg") && name.includes("arm64"));
          const macIntel = findInstaller("macOS x64", name => name.endsWith(".dmg") && name.includes("x64"));
          const android = findInstaller("Android ARM64", name => name === `toonflow-${version}-android-arm64.apk`);
          const renderDownloadBody = baseUrl => {
            const download = name => `${baseUrl}/${encodeURIComponent(name)}`;
            return [
              "## 📦 下载指南",
              "",
              "选择你的设备对应的安装包，点击即可下载：",
              "",
              "| 你的设备 | 下载 |",
              "| --- | --- |",
              `| 💻 Windows（64 位） | [⬇️ 下载 Windows 安装包](${download(windows)}) |`,
              `| 🍎 Mac（M 系列芯片） | [⬇️ 下载 M 系列 Mac 安装包](${download(macArm)}) |`,
              `| 🍎 Mac（Intel 芯片） | [⬇️ 下载 Intel Mac 安装包](${download(macIntel)}) |`,
              `| 📱 Android（ARM64，Android 8 及以上） | [⬇️ 下载 Android APK](${download(android)}) |`,
              "",
              "> 💡 手动安装请选择上表中的链接。下方其他文件供软件自动更新使用。",
              "",
              "## 🚀 安装说明",
              "",
              "- 💻 **Windows**：双击下载的安装包，按提示完成安装。",
              "- 🍎 **Mac**：打开下载的安装包，将 `toonflow.app` 拖入“应用程序”，再从“应用程序”打开。",
              "- 📱 **Android**：在手机上打开 APK，按系统提示允许此来源安装应用。后续版本可直接覆盖安装。",
              "",
              "M 系列 Mac 安装包已完成 Developer ID 签名与 Apple 公证。首次打开时，macOS 仍可能提示确认打开从互联网下载的应用。",
              "",
              "---",
              "",
            ].join("\n");
          };
          writeFileSync("releaseBody.md", renderDownloadBody(`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}`));
          writeFileSync("giteeReleaseBody.md", renderDownloadBody(`https://gitee.com/Chance-Ccc/mangosteen-studio/releases/download/v${version}`));
          JS
      - name: 生成产物校验清单
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | while IFS= read -r name; do
            sha256sum "$name"
          done > SHA256SUMS
          test -s SHA256SUMS
      - name: 发布 GitHub 安装包及更新文件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.commit }}
          name: 山竹漫剧 ${{ needs.build.outputs.version }}
          make_latest: true
          body_path: releaseBody.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
      - name: 同步提交与标签到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: Chance-Ccc
          releaseVersion: ${{ needs.build.outputs.version }}
          buildCommit: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          set +x
          : "${GITEE_TOKEN:?请配置 GITEE_TOKEN Secret}"
          echo "::add-mask::$GITEE_TOKEN"
          if [[ "$(git rev-parse HEAD)" != "$buildCommit" ]]; then
            echo '::error::Gitee 同步代码与构建提交不一致。'
            exit 1
          fi
          tag="v${releaseVersion}"
          localTag="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -n "$localTag" && "$localTag" != "$buildCommit" ]]; then
            echo "::error::$tag 与构建提交不一致。"
            exit 1
          fi
          if [[ -z "$localTag" ]]; then git tag "$tag" "$buildCommit"; fi
          askpass="$RUNNER_TEMP/giteeAskpass.sh"
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/usr/bin/env bash' 'case "$1" in' '*Username*) printf "%s\n" "$GITEE_USERNAME" ;;' '*) printf "%s\n" "$GITEE_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git remote remove gitee 2>/dev/null || true
          git remote add gitee https://gitee.com/Chance-Ccc/mangosteen-studio.git
          git push gitee HEAD:refs/heads/main "refs/tags/$tag:refs/tags/$tag"
          remoteMain="$(git ls-remote gitee refs/heads/main | awk '{print $1}')"
          remoteTag="$(git ls-remote gitee "refs/tags/$tag^{}" | awk '{print $1}')"
          if [[ -z "$remoteTag" ]]; then remoteTag="$(git ls-remote gitee "refs/tags/$tag" | awk '{print $1}')"; fi
          if [[ "$remoteMain" != "$buildCommit" || "$remoteTag" != "$buildCommit" ]]; then
            echo '::error::Gitee main 或发布标签没有指向本次构建提交。'
            exit 1
          fi
      - name: 发布并核验 Gitee Release
        timeout-minutes: 90
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          releaseVersion: ${{ needs.build.outputs.version }}
          buildCommit: ${{ needs.build.outputs.commit }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, statSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          import { join } from "node:path";

          const token = process.env.GITEE_TOKEN?.trim();
          const ghToken = process.env.GH_TOKEN?.trim();
          const version = process.env.releaseVersion ?? "";
          const buildCommit = process.env.buildCommit ?? "";
          if (!token) throw new Error("请配置 GITEE_TOKEN Secret");
          if (!ghToken) throw new Error("GitHub Token 不可用");
          if (!/^\d+\.\d+\.\d+$/.test(version) || !/^[0-9a-f]{40}$/.test(buildCommit)) throw new Error("发布版本或构建提交格式不正确");
          const tag = `v${version}`;
          const giteeApi = "https://gitee.com/api/v5/repos/Chance-Ccc/mangosteen-studio";
          const giteeHeaders = { Authorization: `Bearer ${token}`, Accept: "application/json" };

          async function readResponse(response, label) {
            const text = await response.text();
            if (!response.ok) throw new Error(`${label}失败（HTTP ${response.status}）：${text.slice(0, 300)}`);
            if (!text) return null;
            try { return JSON.parse(text); }
            catch { throw new Error(`${label}未返回有效 JSON`); }
          }
          async function giteeRequest(path, init, label, allowNotFound = false) {
            const response = await fetch(`${giteeApi}${path}`, {
              ...init,
              headers: { ...giteeHeaders, ...init?.headers },
              redirect: "error",
              signal: AbortSignal.timeout(30000),
            });
            if (allowNotFound && response.status === 404) return { response, data: null };
            return { response, data: await readResponse(response, label) };
          }

          const releasePath = `/releases/tags/${encodeURIComponent(tag)}`;
          let { response, data: release } = await giteeRequest(releasePath, {}, "读取 Gitee Release", true);
          const releaseBody = readFileSync("giteeReleaseBody.md", "utf8");
          const releasePayload = { tag_name: tag, target_commitish: buildCommit, name: `山竹漫剧 ${version}`, body: releaseBody, prerelease: false };
          if (response.status === 404) {
            ({ data: release } = await giteeRequest("/releases", {
              method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(releasePayload),
            }, "创建 Gitee Release"));
          } else {
            if (release?.tag_name !== tag) throw new Error("Gitee Release 标签与构建版本不一致");
            ({ data: release } = await giteeRequest(`/releases/${release.id}`, {
              method: "PATCH", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ tag_name: tag, name: releasePayload.name, body: releaseBody, prerelease: false }),
            }, "更新 Gitee Release"));
          }
          if (!Number.isSafeInteger(release?.id) || release.tag_name !== tag || release.prerelease === true) throw new Error("Gitee Release 返回内容不完整");

          const expectedFiles = readdirSync("artifacts", { withFileTypes: true }).filter(entry => entry.isFile()).map(entry => ({
            name: entry.name,
            size: statSync(join("artifacts", entry.name)).size,
          })).sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
          const checksumFile = expectedFiles.find(item => item.name === "SHA256SUMS");
          if (!expectedFiles.length || !checksumFile) throw new Error("发布产物或 SHA256SUMS 缺失");
          // ACT: 校验清单最后上传，把它作为这一批附件完整写入的提交标记。
          const expected = [...expectedFiles.filter(item => item !== checksumFile), checksumFile];
          const checksumText = readFileSync("artifacts/SHA256SUMS", "utf8");
          const checksumNames = checksumText.trim().split("\n").map(line => line.match(/^[0-9a-f]{64}  (.+)$/)?.[1]);
          const artifactNames = expectedFiles.filter(item => item.name !== "SHA256SUMS").map(item => item.name);
          if (checksumNames.some(name => !name) || JSON.stringify(checksumNames) !== JSON.stringify(artifactNames)) {
            throw new Error("SHA256SUMS 没有且仅有全部构建产物");
          }

          const attachmentPath = `/releases/${release.id}/attach_files`;
          let attachments = (await giteeRequest(`${attachmentPath}?page=1&per_page=100&direction=asc`, {}, "读取 Gitee 附件")).data;
          if (!Array.isArray(attachments)) throw new Error("Gitee 附件列表格式不正确");
          const previousChecksums = attachments.filter(item => item?.name === "SHA256SUMS" && Number(item.size) === checksumFile.size);
          let completeBatchExists = false;
          if (previousChecksums.length === 1 && Number.isSafeInteger(previousChecksums[0].id)) {
            const previousChecksumResponse = await fetch(`${giteeApi}${attachmentPath}/${previousChecksums[0].id}/download`, {
              headers: { Authorization: `Bearer ${token}`, Accept: "application/octet-stream" },
              signal: AbortSignal.timeout(30000),
            });
            completeBatchExists = previousChecksumResponse.ok && await previousChecksumResponse.text() === checksumText;
          }
          for (const file of expected) {
            const matches = attachments.filter(item => item?.name === file.name);
            if (completeBatchExists && matches.length === 1 && Number(matches[0].size) === file.size) {
              console.log(`Gitee 已存在 ${file.name}（${file.size} 字节）`);
              continue;
            }
            for (const item of matches) {
              if (!Number.isSafeInteger(item.id)) throw new Error(`${file.name} 的 Gitee 附件 ID 无效`);
              await giteeRequest(`${attachmentPath}/${item.id}`, { method: "DELETE" }, `删除不一致的 Gitee 附件 ${file.name}`);
            }
            console.log(`上传 Gitee 附件 ${file.name}（${file.size} 字节）`);
            const upload = spawnSync("curl", [
              "--silent", "--show-error", "--fail-with-body", "--max-time", "1800",
              "--request", "POST", "--header", `Authorization: Bearer ${token}`,
              "--form", `file=@${join("artifacts", file.name)};filename=${file.name}`,
              `${giteeApi}${attachmentPath}`,
            ], { encoding: "utf8", timeout: 1810000, maxBuffer: 4 * 1024 * 1024 });
            if (upload.status !== 0) throw new Error(`上传 ${file.name} 失败：${(upload.stderr || upload.stdout).slice(0, 500)}`);
            let uploaded;
            try { uploaded = JSON.parse(upload.stdout); }
            catch { throw new Error(`上传 ${file.name} 未返回有效 JSON`); }
            if (uploaded?.name !== file.name || Number(uploaded.size) !== file.size) throw new Error(`${file.name} 上传后的名称或大小不一致`);
          }

          attachments = (await giteeRequest(`${attachmentPath}?page=1&per_page=100&direction=asc`, {}, "核验 Gitee 附件")).data;
          for (const file of expected) {
            const matches = attachments.filter(item => item?.name === file.name && Number(item.size) === file.size);
            if (matches.length !== 1) throw new Error(`Gitee 附件 ${file.name} 数量或大小不正确`);
          }
          const giteeChecksum = attachments.find(item => item?.name === "SHA256SUMS");
          const checksumResponse = await fetch(`${giteeApi}${attachmentPath}/${giteeChecksum.id}/download`, {
            headers: { Authorization: `Bearer ${token}`, Accept: "application/octet-stream" },
            signal: AbortSignal.timeout(30000),
          });
          if (!checksumResponse.ok || await checksumResponse.text() !== checksumText) throw new Error("Gitee SHA256SUMS 下载核验失败");

          const githubHeaders = { Authorization: `Bearer ${ghToken}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
          const githubReleaseResponse = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${tag}`, {
            headers: githubHeaders, signal: AbortSignal.timeout(30000),
          });
          const githubRelease = await readResponse(githubReleaseResponse, "读取 GitHub Release");
          for (const file of expected) {
            const matches = githubRelease.assets.filter(item => item?.name === file.name && Number(item.size) === file.size);
            if (matches.length !== 1) throw new Error(`GitHub 附件 ${file.name} 数量或大小不正确`);
          }
          const githubChecksum = githubRelease.assets.find(item => item?.name === "SHA256SUMS");
          const githubChecksumResponse = await fetch(githubChecksum.browser_download_url, { signal: AbortSignal.timeout(30000) });
          if (!githubChecksumResponse.ok || await githubChecksumResponse.text() !== checksumText) throw new Error("GitHub SHA256SUMS 下载核验失败");
          console.log(`GitHub 与 Gitee 已发布 ${expected.length} 个同名、同大小产物，并共享同一 SHA256SUMS`);
          JS
