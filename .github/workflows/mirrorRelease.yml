name: Mirror Existing GitHub Release to Gitee
run-name: Release ${{ inputs.operation }} v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 已发布到 GitHub 的版本号（X.Y.Z）
        type: string
        required: true
      operation:
        description: 发布维护操作
        type: choice
        options:
          - mirror
          - remove-checksum
        default: mirror
        required: true
      useSelfHosted:
        description: 使用临时 Windows self-hosted runner（仅用于 Gitee 大附件直传）
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: mirror-release-to-gitee
  cancel-in-progress: false

jobs:
  cleanup:
    name: 删除两端校验附件
    if: inputs.operation == 'remove-checksum'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 删除 GitHub 校验附件并更新说明
        env:
          GH_TOKEN: ${{ github.token }}
          releaseVersion: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${releaseVersion#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::版本号必须为 X.Y.Z'
            exit 1
          fi
          tag="v${version}"
          notes="docs/releases/${tag}.md"
          windowsInstaller="MangosteenStudio-Windows-x64-v${version}-Setup.exe"
          test -s "$notes"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          jq -e --arg windowsInstaller "$windowsInstaller" '.assets | (any(.name | endswith(".dmg")) or any(.name == $windowsInstaller))' <<<"$release" >/dev/null
          assetIds="$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .id' <<<"$release")"
          while IFS= read -r assetId; do
            [[ -z "$assetId" ]] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${assetId}"
          done <<<"$assetIds"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          jq -e '.assets | any(.name == "SHA256SUMS") | not' <<<"$release" >/dev/null
          jq -e --arg windowsInstaller "$windowsInstaller" '.assets | (any(.name | endswith(".dmg")) or any(.name == $windowsInstaller))' <<<"$release" >/dev/null

      - name: 删除 Gitee 校验附件并更新说明
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          releaseVersion: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";

          const token = process.env.GITEE_TOKEN?.trim();
          const version = (process.env.releaseVersion ?? "").replace(/^v/, "");
          if (!token || !/^\d+\.\d+\.\d+$/.test(version)) throw new Error("发布凭据或版本无效");
          const tag = `v${version}`;
          const api = "https://gitee.com/api/v5/repos/Chance-Ccc/mangosteen-studio";
          const headers = { Authorization: `Bearer ${token}`, Accept: "application/json" };

          async function request(path, init = {}) {
            const response = await fetch(`${api}${path}`, {
              ...init,
              headers: { ...headers, ...init.headers },
              redirect: "error",
              signal: AbortSignal.timeout(30000),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`Gitee API ${path} 失败（HTTP ${response.status}）：${text.slice(0, 300)}`);
            return text ? JSON.parse(text) : null;
          }

          const release = await request(`/releases/tags/${encodeURIComponent(tag)}`);
          if (!Number.isSafeInteger(release?.id)) throw new Error("Gitee Release 不存在或返回内容无效");
          const attachmentPath = `/releases/${release.id}/attach_files`;
          let attachments = await request(`${attachmentPath}?page=1&per_page=100&direction=asc`);
          if (!Array.isArray(attachments)) throw new Error("Gitee 附件列表格式错误");
          const windowsInstaller = `MangosteenStudio-Windows-x64-v${version}-Setup.exe`;
          const hasInstaller = items => items.some(item => typeof item?.name === "string" && (item.name.endsWith(".dmg") || item.name === windowsInstaller));
          if (!hasInstaller(attachments)) throw new Error("Gitee 桌面安装包缺失");
          for (const attachment of attachments.filter(item => item?.name === "SHA256SUMS")) {
            if (!Number.isSafeInteger(attachment.id)) throw new Error("Gitee 校验附件 ID 无效");
            await request(`${attachmentPath}/${attachment.id}`, { method: "DELETE" });
          }

          const body = readFileSync(`docs/releases/${tag}.md`, "utf8");
          await request(`/releases/${release.id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tag_name: tag, name: release.name, body, prerelease: false }),
          });

          attachments = await request(`${attachmentPath}?page=1&per_page=100&direction=asc`);
          if (attachments.some(item => item?.name === "SHA256SUMS")) throw new Error("Gitee 校验附件仍然存在");
          if (!hasInstaller(attachments)) throw new Error("Gitee 桌面安装包缺失");
          console.log(`Gitee Release ${tag} 已删除校验附件，桌面安装包保留`);
          JS

  mirror:
    name: 核验并同步 Gitee Release
    if: inputs.operation == 'mirror'
    runs-on: ${{ inputs.useSelfHosted && fromJSON('["self-hosted","Windows","X64","mangosteen-v013"]') || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载并校验 GitHub Release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          releaseVersion: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${releaseVersion#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::版本号必须为 X.Y.Z'
            exit 1
          fi
          tag="v${version}"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          export release
          commit="$(node --input-type=module -e '
            const release = JSON.parse(process.env.release);
            if (release.draft || release.prerelease) throw new Error("只能同步已正式发布的 GitHub Release");
            if (!/^[0-9a-f]{40}$/.test(release.target_commitish ?? "")) throw new Error("GitHub Release 必须绑定精确提交");
            process.stdout.write(release.target_commitish);
          ')"
          sourceCommit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" "$sourceCommit"; then
            echo '::error::GitHub Release 提交不属于当前默认分支'
            exit 1
          fi
          mkdir artifacts
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir artifacts
          test -s artifacts/SHA256SUMS
          (
            cd artifacts
            sha256sum --check SHA256SUMS
          )
          export artifactsDirectory="$PWD/artifacts"
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync } from "node:fs";
          const files = readdirSync(process.env.artifactsDirectory).sort();
          const assets = files.filter(name => name !== "SHA256SUMS");
          const version = (process.env.releaseVersion ?? "").replace(/^v/, "");
          const windowsInstaller = `MangosteenStudio-Windows-x64-v${version}-Setup.exe`;
          if (!assets.length || !assets.some(name => name.endsWith(".dmg") || name === windowsInstaller)) throw new Error("Release 缺少桌面安装包");
          const checksums = readFileSync(`${process.env.artifactsDirectory}/SHA256SUMS`, "utf8").trim().split("\n").map(line => {
            const match = line.match(/^[0-9a-f]{64}  ([^/\\]+)$/);
            if (!match) throw new Error("SHA256SUMS 格式不正确");
            return match[1];
          }).sort();
          if (JSON.stringify(checksums) !== JSON.stringify(assets)) throw new Error("SHA256SUMS 没有且仅有全部 Release 产物");
          JS
          printf 'version=%s\ntag=%s\ncommit=%s\nsourceCommit=%s\n' "$version" "$tag" "$commit" "$sourceCommit" >> "$GITHUB_OUTPUT"

      - name: 同步代码与标签到 Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USERNAME: Chance-Ccc
          releaseTag: ${{ steps.prepare.outputs.tag }}
          releaseCommit: ${{ steps.prepare.outputs.commit }}
          sourceCommit: ${{ steps.prepare.outputs.sourceCommit }}
        run: |
          set -euo pipefail
          set +x
          : "${GITEE_TOKEN:?请配置 GITEE_TOKEN Secret}"
          echo "::add-mask::$GITEE_TOKEN"
          askpass="$RUNNER_TEMP/giteeAskpass.sh"
          trap 'rm -f "$askpass"' EXIT
          printf '%s\n' '#!/usr/bin/env bash' 'case "$1" in' '*Username*) printf "%s\n" "$GITEE_USERNAME" ;;' '*) printf "%s\n" "$GITEE_TOKEN" ;;' 'esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git remote add gitee https://gitee.com/Chance-Ccc/mangosteen-studio.git
          localTag="$(git rev-list -n 1 "$releaseTag" 2>/dev/null || true)"
          if [[ -n "$localTag" && "$localTag" != "$releaseCommit" ]]; then
            echo '::error::本地同名标签指向其他提交'
            exit 1
          fi
          if [[ -z "$localTag" ]]; then git tag "$releaseTag" "$releaseCommit"; fi
          git push gitee HEAD:refs/heads/main "refs/tags/${releaseTag}:refs/tags/${releaseTag}"
          remoteMain="$(git ls-remote gitee refs/heads/main | awk '{print $1}')"
          remoteTag="$(git ls-remote gitee "refs/tags/${releaseTag}^{}" | awk '{print $1}')"
          if [[ -z "$remoteTag" ]]; then remoteTag="$(git ls-remote gitee "refs/tags/${releaseTag}" | awk '{print $1}')"; fi
          if [[ "$remoteMain" != "$sourceCommit" || "$remoteTag" != "$releaseCommit" ]]; then
            echo '::error::Gitee main 或版本标签与发布提交不一致'
            exit 1
          fi

      - name: 创建并核验 Gitee Release
        timeout-minutes: 125
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          releaseVersion: ${{ steps.prepare.outputs.version }}
          releaseCommit: ${{ steps.prepare.outputs.commit }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync, statSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          import { join } from "node:path";

          const token = process.env.GITEE_TOKEN?.trim();
          const version = process.env.releaseVersion ?? "";
          const commit = process.env.releaseCommit ?? "";
          if (!token || !/^\d+\.\d+\.\d+$/.test(version) || !/^[0-9a-f]{40}$/.test(commit)) throw new Error("发布凭据、版本或提交无效");
          const tag = `v${version}`;
          const api = "https://gitee.com/api/v5/repos/Chance-Ccc/mangosteen-studio";
          const headers = { Authorization: `Bearer ${token}`, Accept: "application/json" };

          async function request(path, init = {}, allowNotFound = false) {
            const response = await fetch(`${api}${path}`, {
              ...init,
              headers: { ...headers, ...init.headers },
              redirect: "error",
              signal: AbortSignal.timeout(30000),
            });
            const text = await response.text();
            if (allowNotFound && response.status === 404) return { response, data: null };
            if (!response.ok) throw new Error(`Gitee API ${path} 失败（HTTP ${response.status}）：${text.slice(0, 300)}`);
            return { response, data: text ? JSON.parse(text) : null };
          }

          const notesPath = `docs/releases/v${version}.md`;
          const body = readFileSync(notesPath, "utf8");
          const payload = { tag_name: tag, target_commitish: commit, name: `山竹漫剧 ${version}`, body, prerelease: false };
          const releasePath = `/releases/tags/${encodeURIComponent(tag)}`;
          let { response, data: release } = await request(releasePath, {}, true);
          // Gitee 对不存在的标签可能返回 HTTP 200 与 JSON null，也可能返回 404。
          if (response.status === 404 || release === null) {
            ({ data: release } = await request("/releases", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            }));
          } else {
            ({ data: release } = await request(`/releases/${release.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ tag_name: tag, name: payload.name, body, prerelease: false }),
            }));
          }
          if (!Number.isSafeInteger(release?.id) || release.tag_name !== tag || release.prerelease === true) throw new Error("Gitee Release 返回内容无效");

          const expected = readdirSync("artifacts", { withFileTypes: true })
            .filter(entry => entry.isFile())
            .map(entry => ({ name: entry.name, size: statSync(join("artifacts", entry.name)).size }))
            .sort((a, b) => a.size - b.size || a.name.localeCompare(b.name));
          const attachmentPath = `/releases/${release.id}/attach_files`;
          let attachments = (await request(`${attachmentPath}?page=1&per_page=100&direction=asc`)).data;
          if (!Array.isArray(attachments)) throw new Error("Gitee 附件列表格式错误");
          for (const file of expected) {
            const matches = attachments.filter(item => item?.name === file.name);
            if (matches.length === 1 && Number(matches[0].size) === file.size) continue;
            for (const item of matches) {
              if (!Number.isSafeInteger(item.id)) throw new Error(`${file.name} 的附件 ID 无效`);
              await request(`${attachmentPath}/${item.id}`, { method: "DELETE" });
            }
            const upload = spawnSync("curl", [
              "--silent", "--show-error", "--fail-with-body", "--max-time", "3600",
              "--connect-timeout", "30", "--http1.1", "--header", "Expect:",
              "--request", "POST", "--header", `Authorization: Bearer ${token}`,
              "--form-string", `access_token=${token}`,
              "--form", `file=@${join("artifacts", file.name)};filename=${file.name}`,
              `${api}${attachmentPath}`,
            ], { encoding: "utf8", timeout: 3610000, maxBuffer: 4 * 1024 * 1024 });
            if (upload.status !== 0) throw new Error(`上传 ${file.name} 失败：${(upload.stderr || upload.stdout).slice(0, 500)}`);
            const uploaded = JSON.parse(upload.stdout);
            if (uploaded?.name !== file.name || Number(uploaded.size) !== file.size) throw new Error(`${file.name} 上传后名称或大小不一致`);
          }

          attachments = (await request(`${attachmentPath}?page=1&per_page=100&direction=asc`)).data;
          const expectedNames = new Set(expected.map(item => item.name));
          if (attachments.length !== expected.length || attachments.some(item => !expectedNames.has(item?.name))) throw new Error("Gitee Release 附件集合不一致");
          for (const file of expected) {
            if (attachments.filter(item => item?.name === file.name && Number(item.size) === file.size).length !== 1) throw new Error(`Gitee 附件 ${file.name} 数量或大小不正确`);
          }
          const checksum = attachments.find(item => item?.name === "SHA256SUMS");
          const checksumResponse = await fetch(`${api}${attachmentPath}/${checksum.id}/download`, {
            headers,
            signal: AbortSignal.timeout(30000),
          });
          if (!checksumResponse.ok || await checksumResponse.text() !== readFileSync("artifacts/SHA256SUMS", "utf8")) throw new Error("Gitee SHA256SUMS 下载核验失败");
          console.log(`Gitee Release ${tag} 已核验：${expected.length} 个附件`);
          JS
